# tasks file for install-softwares

# Use ansible role to 
# Install sublime
# Install Jenkins
# Install Python 3.14 version
# Install Chrome
# Install notepad++
#===============================

# Install sublime
# https://www.sublimetext.com/docs/linux_repositories.html#dnf

- name: Import Sublime Text GPG key
  rpm_key:
    key: https://download.sublimetext.com/sublimehq-rpm-pub.gpg
    state: present
- name: Add repository
  yum_repository:
   name: sublime-Text
   description: Sublime Text - x86_64 - Stable
   baseurl: https://download.sublimetext.com/rpm/stable/x86_64
   gpgcheck: yes
   gpgkey: https://download.sublimetext.com/sublimehq-rpm-pub.gpg
   enabled: yes
- name: Install Sublime Text
  dnf:
    name: sublime-text
    state: present


# Install Jenkins

# installing java - jenkins dependency
- name: Install Java 21 
  dnf:
    name: java-21-amazon-corretto
    state: present
- name: Check Java 21 installation
  command: java --version
  register: java_version

- name: Display Java version
  debug:
    var: java_version.stderr_lines

# JENKINS
- name: Import Jenkins GPG key
  rpm_key:
    key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
    state: present
- name: Add Jenkins yum repository
  yum_repository:
    name: jenkins
    description: Jenkins Stable
    baseurl: https://pkg.jenkins.io/redhat-stable/
    gpgcheck: no
    gpgkey: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
    enabled: yes
- name: Install Jenkins
  dnf:
    name: jenkins
    state: present
    disable_gpg_check: yes 
- name: Enable and start Jenkins service
  systemd:
    name: jenkins
    enabled: yes
    state: started

# Install Python 3.14 version
- name: Install Python dependencies
  dnf:
    name:
      - gcc
      - make
      - openssl-devel
      - bzip2-devel
      - libffi-devel
      - zlib-devel
      - readline-devel
      - sqlite-devel
      - wget
      - tar
      - xz-devel
    state: present

- name: Download Python 3.14 source
  get_url:
    url: https://www.python.org/ftp/python/3.14.0/Python-3.14.0.tgz
    dest: /tmp/Python-3.14.0.tgz

- name: Extract Python source
  unarchive:
    src: /tmp/Python-3.14.0.tgz
    dest: /tmp/
    remote_src: yes

- name: Configure Python 3.14
  command: ./configure --enable-optimizations --prefix=/usr/local
  args:
    chdir: /tmp/Python-3.14.0

- name: Build Python 3.14
  command:  make -j "{{ ansible_facts['processor_vcpus'] }}"
  args:
    chdir: /tmp/Python-3.14.0

- name: Install Python 3.14 (altinstall to avoid overwriting system python)
  command: make altinstall
  args:
    chdir: /tmp/Python-3.14.0

- name: Clean up Python source files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/Python-3.14.0.tgz
    - /tmp/Python-3.14.0


# Install Chrome
- name: Add Google Chrome yum repository
  yum_repository:
    name: google-chrome
    description: Google Chrome
    baseurl: https://dl.google.com/linux/chrome/rpm/stable/x86_64
    gpgcheck: yes
    gpgkey: https://dl.google.com/linux/linux_signing_key.pub
    enabled: yes

- name: Install Google Chrome
  dnf:
    name: google-chrome-stable
    state: present

