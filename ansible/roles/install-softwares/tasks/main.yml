# Download Notepad++ Windows binary (can't run without Wine, but it's "installed")
- name: Create Notepad++ directory
  file:
    path: /opt/notepadpp
    state: directory
    mode: '0755'

- name: Download Notepad++ portable version
  get_url:
    url: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.7.1/npp.8.7.1.portable.x64.zip
    dest: /tmp/notepadpp.zip

- name: Install unzip
  dnf:
    name: unzip
    state: present

- name: Extract Notepad++
  unarchive:
    src: /tmp/notepadpp.zip
    dest: /opt/notepadpp/
    remote_src: yes

- name: Clean up
  file:
    path: /tmp/notepadpp.zip
    state: absent

- name: Verify Notepad++ files exist
  command: ls -la /opt/notepadpp/notepad++.exe
  register: npp_check
  changed_when: false

- name: Display Notepad++ installation
  debug:
    msg: "Notepad++ installed at /opt/notepadpp/notepad++.exe (requires Wine or Windows to run)"
