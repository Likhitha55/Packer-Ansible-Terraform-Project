---
# tasks file for mount-volume
- name: Set device and mount variables
  set_fact:
    device_name: "/dev/xvdf"
    mount_point: "/data"


- name: Wait for device
  wait_for:
    path: "{{ device_name }}"
    state: present
    timeout: 60

- name: Check if filesystem exists on device
  command: blkid {{ device_name }}
  register: blkid_result
  changed_when: false
  failed_when: false

# Formatting
- name: Create ext4 filesystem on the volume
  filesystem:
    fstype: ext4
    dev: "{{ device_name }}"
  when: blkid_result.rc != 0


- name: Create mount point directory
  file:
    path: "{{ mount_point }}"
    state: directory
    mode: '0755'
    owner: root
    group: root


- name: Mount the extra volume
  mount:
    path: "{{ mount_point }}"
    src: "{{ device_name }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted


- name: Verify fstab entry exists
  command: grep "{{ device_name }}" /etc/fstab
  register: fstab_check
  changed_when: false
  failed_when: false

- name: Display mount
  command: df -h {{ mount_point }}
  register: df_output
  changed_when: false

- name: Show mount details
  debug:
    var: df_output.stdout_lines

